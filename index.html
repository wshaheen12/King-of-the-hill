<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>The Hill - Gino and Carlo</title>
    <style>
        :root { --bg: #0a0a0a; --card: #161616; --accent: #22c55e; --text: #ffffff; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { padding: 20px; text-align: center; border-bottom: 1px solid #333; }
        .prize { background: var(--accent); color: #000; font-weight: bold; padding: 8px; font-size: 14px; text-transform: uppercase; text-align: center; }
        .match-up { display: flex; justify-content: space-around; align-items: center; padding: 40px 20px; background: var(--card); }
        .player { text-align: center; flex: 1; }
        .name { font-size: 32px; font-weight: 800; margin: 10px 0; color: var(--accent); }
        .rail { flex: 1; overflow-y: auto; padding: 20px; border-top: 1px solid #333; }
        .rail-item { background: #222; margin-bottom: 8px; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; }
        .controls { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #111; }
        button { padding: 20px; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .btn-join { background: var(--accent); color: #000; grid-column: span 2; margin-bottom: 10px; }
        .btn-win { background: #3b82f6; color: white; }
    </style>
</head>
<body>

<div class="prize">Current Prize: $50 Bar Tab</div>
<header><h1>GINO AND CARLO</h1></header>

<div class="match-up">
    <div class="player"><div style="font-size: 12px; opacity: 0.6;">KING</div><div id="kingName" class="name">Waiting...</div></div>
    <div style="font-style: italic; opacity: 0.3;">vs</div>
    <div class="player"><div style="font-size: 12px; opacity: 0.6;">CHALLENGER</div><div id="challengerName" class="name">---</div></div>
</div>

<div class="rail" id="railList"></div>

<div class="controls">
    <button class="btn-join" onclick="joinQueue()">TAP TO JOIN THE RAIL</button>
    <button class="btn-win" onclick="reportWin('king')">King Won</button>
    <button class="btn-win" onclick="reportWin('challenger')" style="background:#8b5cf6">Challenger Won</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // PASTE YOUR FIREBASE CONFIG HERE
    const firebaseConfig = {
"apiKey: ""AIzaSyBHSKSdQL4mCJRCJPtzsyuTS2ufYVTHRs0"","
"authDomain: ""king-of-the-hill---gc.firebaseapp.com"","
"projectId: ""king-of-the-hill---gc"","
"storageBucket: ""king-of-the-hill---gc.firebasestorage.app"","
"messagingSenderId: ""58909885939"","
"appId: ""1:58909885939:web:19c349c796571f7e85fe86"""
};
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const queueRef = collection(db, "queues");

    // FUNCTION: Join Queue
    window.joinQueue = async () => {
        const name = prompt("Enter your name:");
        if (name) {
            await addDoc(queueRef, { playerName: name, joinedAt: Date.now() });
        }
    };

    // FUNCTION: Report Win
    window.reportWin = async (winner) => {
        // Logic: Loser gets deleted from the database, Winner stays at top
        // For the pilot, this simple version requires you to manually manage the "King" status
        alert("Result logged! The rail will update.");
    };

    // LIVE UPDATES
    onSnapshot(query(queueRef, orderBy("joinedAt", "asc")), (snapshot) => {
        const players = [];
        snapshot.forEach(doc => players.push({id: doc.id, ...doc.data()}));
        
        document.getElementById('kingName').innerText = players[0]?.playerName || "Open Table";
        document.getElementById('challengerName').innerText = players[1]?.playerName || "---";
        
        const railHtml = players.slice(2).map((p, i) => `
            <div class="rail-item"><span>${i+1}. ${p.playerName}</span><span style="opacity:0.5">Waiting</span></div>
        `).join('');
        document.getElementById('railList').innerHTML = railHtml;
    });
</script>
</body>
</html>
